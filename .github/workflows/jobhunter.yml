name: CyberJobHunter scheduled search
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "cybersecurity_job_hunter.py"
      - "requirements.txt"
      - "docs/index.html"
      - ".github/workflows/jobhunter.yml"
  schedule:
    - cron: "30 3 * * 1,4"
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: cyberjobhunter-pages
  cancel-in-progress: false
jobs:
  search-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run opportunity discovery and enrichment
        run: python cybersecurity_job_hunter.py
      - name: Commit generated output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "Update CyberJobHunter opportunities"
          git push
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload dashboard
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy dashboard
        uses: actions/deploy-pages@v4
